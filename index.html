<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visible Video Player</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* The video should always be visible and clickable */
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: black;
      z-index: 1;
      position: relative;
    }

    /* Overlay button */
    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 2rem;
      cursor: pointer;
      z-index: 2;
      transition: opacity 0.3s ease;
    }

    #overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #overlay span {
      padding: 1em 2em;
      border: 2px solid white;
      border-radius: 6px;
      background: rgba(255,255,255,0.1);
    }
  </style>
</head>
<body>
  
  <video id="myVideo" autoplay muted loop playsinline>
    <source src="Part For Insta (3) (2)-2.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <div id="overlay"><span>▶ Tap to Play & Unmute</span></div>

  <script>
    const video = document.getElementById('myVideo');
    const overlay = document.getElementById('overlay');

    overlay.addEventListener('click', async () => {
      overlay.classList.add('hidden');
      video.muted = false;
      video.controls = true;
      video.loop = false; // optional – loop can interfere with UI
      try {
        await video.play();
      } catch (err) {
        console.error('Playback error:', err);
      }
    });
  </script>

</body>
</html>
