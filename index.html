<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visible Video Player</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* The video is constrained to a visible area in the center */
    video {
      /* FIX 1: Use max dimensions to ensure controls are not pushed off screen */
      max-width: 95vw; 
      max-height: 95vh;
      width: auto;
      height: auto;
      
      object-fit: contain;
      background: black;
      z-index: 1;
      position: relative;
      border-radius: 8px; /* Added rounded corners for aesthetics */
    }

    /* Overlay button */
    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 2rem;
      cursor: pointer;
      z-index: 2;
      transition: opacity 0.3s ease;
    }

    #overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #overlay span {
      padding: 1em 2em;
      border: 2px solid white;
      border-radius: 8px;
      background: rgba(255,255,255,0.15);
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      transition: background 0.2s;
    }
    
    #overlay span:hover {
      background: rgba(255,255,255,0.25);
    }
  </style>
</head>
<body>
  
  <!-- FIX 2: Removed 'autoplay' attribute to avoid background mode conflicts -->
  <video id="myVideo" muted loop playsinline>
    <source src="Part For Insta (3) (2)-2.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <div id="overlay"><span>▶ Tap to Play & Unmute</span></div>

  <script>
    const video = document.getElementById('myVideo');
    const overlay = document.getElementById('overlay');

    overlay.addEventListener('click', async () => {
      // 1. Hide overlay first for better UX
      overlay.classList.add('hidden');
      
      // 2. Unmute and set controls
      video.muted = false;
      video.controls = true;
      video.loop = false; 

      // 3. FIX 3: Force the browser to re-evaluate the video state for control display
      video.load(); 

      // 4. Attempt to play
      try {
        await video.play();
      } catch (err) {
        // If play fails (e.g., if the user is in low power mode on iOS)
        console.error('Playback error:', err);
        // Re-display the overlay with an error message or fallback logic here if needed
      }
    });
  </script>

</body>
</html>
