<!DOCTYPE html>
<html>
<head>
    <title>Korkut</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* 1. Wrapper handles the full-screen/background effect */
        #video-bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden; /* Hide any parts of the video that exceed the screen */
            z-index: -100;
        }

        /* 2. Video element scales to fill the container without aggressive positioning */
        #myVideo {
            width: 100%;
            height: 100%;
            /* Use 'contain' to ensure the whole video is visible */
            object-fit: contain; 
        }

        /* Overlay Button/Prompt Styling (Remains the same) */
        #unmuteButton {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5); 
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            cursor: pointer;
            border: none;
            color: white;
            font-size: 2em;
            font-family: sans-serif;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body>

    <div id="video-bg-container">
        <video id="myVideo" autoplay loop muted playsinline>
            <source src="Part For Insta (3) (2)-2.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

    <button id="unmuteButton">
        ▶ TAP TO PLAY & UNMUTE
    </button>

    <script>
        document.getElementById('unmuteButton').addEventListener('click', function() {
            const video = document.getElementById('myVideo');
            
            // 1. UNLOCK SOUND
            video.muted = false;
            
            // 2. SHOW CONTROLS (This is now less likely to conflict)
            video.setAttribute('controls', 'true');
            
            // 3. Ensure playback starts/resumes
            const playPromise = video.play();
            
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.warn("Playback prevented:", error);
                });
            }

            // 4. HIDE THE OVERLAY BUTTON
            this.style.display = 'none';
        });
    </script>

</body>
</html>
