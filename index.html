<!DOCTYPE html>
<html>
<head>
    <title>Video Playback</title>
    <style>
        /* Optional: Hide scrollbars and set background to black */
        body { margin: 0; padding: 0; background-color: black; overflow: hidden; }

        /* Full-screen video styling */
        video {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -100;
            transform: translate(-50%, -50%);
            object-fit: contain; /* Ensures the whole video is visible, letter-boxing if necessary */
        }
    </style>
</head>
<body>

<video autoplay loop muted playsinline>
    <source src="Part For Insta (3) (2)-2.mp4" type="video/mp4">
    Your browser does not support the video tag.
</video>

</body>
</html>
